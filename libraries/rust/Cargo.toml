[package]
name = "deckr-core"
version = "0.3.0-dev.0"
edition = "2021"
license = "MIT"
description = "Rust core contract helpers for Deckr"

[lib]
name = "deckr_core"
path = "src/lib.rs"

[[bin]]
name = "deckr-rust-static-conformance"
path = "src/bin/static_conformance.rs"
required-features = ["conformance"]

[features]
default = ["conformance"]
conformance = ["dep:clap", "dep:jsonschema"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"], optional = true }
jsonschema = { version = "0.17", features = ["draft202012"], optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }
