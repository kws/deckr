[package]
name = "deckr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable Rust core contracts for Deckr"

[features]
default = []
nats = ["dep:async-nats"]

[dependencies]
async-nats = { version = "0.47", default-features = false, features = ["kv", "ring", "server_2_11"], optional = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3"
futures-core = "0.3"
futures-util = "0.3"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time"] }
